repos:
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.10.0
  hooks:
  - id: mypy
    pass_filenames: false
    args: [ --config-file=pyproject.toml ]
    additional_dependencies: [ types-PyYAML, types-requests ]
- repo: local
  hooks:
  - id: isort
    name: isort
    entry: isort
    language: system
    types: [ python ]
    require_serial: true
    args: [ "--profile", "black", "--line-length", "95" ]
    stages: [ pre-commit ]
  - id: black
    name: black
    entry: black
    language: system
    types: [ python ]
    require_serial: true
    args: [ "--line-length", "95" ]
  - id: flake8
    name: flake8
    entry: flake8
    language: system
    exclude: '(^test?/|/__init__\.py$)'
    types: [ python ]
    require_serial: true
    args: [ "--max-line-length", "95" ]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v3.2.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
